name: guardian
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - name: Check + rescue both accounts
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          PAT_MAIN: ${{ secrets.MAIN_GH_TOKEN }}
          PAT_PERS: ${{ secrets.PERSONAL_GH_TOKEN }}
        run: |
          tg() { curl -s "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" -d text="$1" >/dev/null; }
          guard() {
            local PAT="$1" OWNER="$2" NOW C FILE SHA BODY RES NEWSHA
            NOW=$(date -u +%H%M)
            C=$(curl -s -H "Authorization: bearer $PAT" https://api.github.com/graphql \
              -d "{\"query\":\"query{viewer{contributionsCollection(from:\\\"$(date -u +%FT00:00:00Z)\\\",to:\\\"$(date -u +%FT%TZ)\\\"){contributionCalendar{contributionDays{contributionCount}}}}}\"}" \
              | jq '[.data.viewer.contributionsCollection.contributionCalendar.contributionDays[].contributionCount] | add // 0')
            [ "$C" -gt 0 ] && return 0
            if [ "$NOW" -ge 1530 ] && [ "$NOW" -lt 1700 ]; then
              tg "🔥 [$OWNER] 0 contributions today! Streak at risk — deadline 22:30 IST"
            elif [ "$NOW" -ge 1700 ]; then
              tg "🔥 [$OWNER] still 0 — auto-rescuing..."
              FILE=$(curl -s -H "Authorization: Bearer $PAT" "https://api.github.com/repos/$OWNER/daily-log/contents/README.md")
              SHA=$(echo "$FILE" | jq -r .sha)
              BODY=$(echo "$FILE" | jq -r .content | base64 -d)
              printf '%s\n### %s — kept alive 🔥 (auto-rescue)\n' "$BODY" "$(date -u +%F)" | base64 -w0 > /tmp/b64
              RES=$(curl -s -X PUT -H "Authorization: Bearer $PAT" \
                "https://api.github.com/repos/$OWNER/daily-log/contents/README.md" \
                -d "{\"message\":\"docs: daily log $(date -u +%F)\",\"content\":\"$(cat /tmp/b64)\",\"sha\":\"$SHA\"}")
              NEWSHA=$(echo "$RES" | jq -r '.commit.sha // empty')
              [ -n "$NEWSHA" ] && tg "🤖 [$OWNER] rescue committed — streak saved ✅" || tg "❌ [$OWNER] rescue FAILED"
            fi
          }
          guard "$PAT_MAIN" "hackerrrarccc-sys"
          guard "$PAT_PERS" "Nimmanagothitharunkumarhello"
